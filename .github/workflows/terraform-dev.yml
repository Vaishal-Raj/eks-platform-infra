name: Terraform (dev)

# PR into dev  -> checks + plan every dev client, every stack (read-only role)
# merge to dev -> checks + apply every dev client, every stack (dev environment role)

on:
  pull_request:
    branches: [dev]
    paths:
      - "config/**"
      - "scripts/**"
      - "stacks/**"
      - ".github/workflows/terraform-dev.yml"
  push:
    branches: [dev]
    paths:
      - "config/**"
      - "scripts/**"
      - "stacks/**"
      - ".github/workflows/terraform-dev.yml"

permissions:
  id-token: write   # OIDC token for AWS
  contents: read

# Never run two Terraform jobs against dev at once, and never cancel one halfway
concurrency:
  group: terraform-dev
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    name: fmt + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate configs
        run: |
          pip install -r scripts/requirements.txt
          python scripts/config.py validate

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive -diff

      - name: Validate stacks and bootstrap roots
        run: |
          set -euo pipefail
          for dir in stacks/* bootstrap/*; do
            echo "::group::validate $dir"
            terraform -chdir="$dir" init -backend=false -input=false > /dev/null
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  plan:
    name: plan
    if: github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/gha-eks-infra-plan
          aws-region: ${{ env.AWS_REGION }}

      - name: Plan every dev client, every stack
        run: |
          set -euo pipefail
          for cfg in config/clients/*/dev.json; do
            client=$(basename "$(dirname "$cfg")")
            python scripts/config.py resolve --client "$client" --env dev > /dev/null
            for stack in $(ls stacks | sort); do
              echo "::group::plan $client/dev/$stack"
              scripts/tf-stack.sh "$client" dev "$stack" plan
              echo "::endgroup::"
              {
                echo "### \`$client / dev / $stack\`"
                echo '```'
                terraform -chdir="stacks/$stack" show -no-color "$PWD/build/$client/dev/$stack.tfplan"
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            done
          done

